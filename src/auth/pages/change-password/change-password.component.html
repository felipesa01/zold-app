<div class="login-page">
    <div class="login-card">
        <div class="logo">ZÖLD</div>
        <h1>Alterar Senha</h1>
        <p class="subtitle">Defina uma nova senha.</p>
        <form [formGroup]="form" (ngSubmit)="changePassword()">
            <div class="field">
                <label>Senha Atual</label>
                <input type="password" formControlName="currentPassword" autocomplete="current-password">
            </div>
            <div class="field">
                <label>Nova Senha</label>
                <input type="password" formControlName="newPassword" autocomplete="new-password">
            </div>
            <div class="field">
                <label>Confirmar Nova Senha</label>
                <input type="password" formControlName="confirmPassword" autocomplete="new-password">
            </div>
            <div *ngIf="error" class="error">{{ error }}</div>
            <button type="submit" [disabled]="loading || form.invalid">{{ loading ? 'Salvando...' : 'Alterar Senha' }}</button>
        </form>
    </div>
</div>

<div class="page">

    <button mat-button (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
      Workspace
    </button>
  
    <div class="page-header">
      <div class="header-left">
  
        <h1>Armadilhas de carrapatos</h1>
      </div>
  
  
  
      <button mat-flat-button color="primary" (click)="create()">
        <mat-icon>add</mat-icon>
        Nova armadilha
      </button>
    </div>
  
    <!-- BUSCA MODERNA -->
    <div class="search-box">
      <mat-icon>search</mat-icon>
      <input placeholder="Buscar armadilhas..." (input)="onSearch($event)" />
    </div>
  
    <!-- FILTROS MODERNOS -->
    <div class="filters-modern">

      <!-- <input type="date" class="filter-date" (change)="onFim($event)" /> -->
  
      <!-- Limpar -->
      <!-- <button class="clear-btn" (click)="resetFilters()">Limpar</button> -->
  
      <button mat-stroked-button class="clear-btn ms-auto" (click)="reload()">
        <mat-icon>refresh</mat-icon>
        Atualizar
      </button>
  
    </div>
  
    @if (loading()) {
    <div class="workspace-loading">
      <mat-spinner diameter="40"></mat-spinner>
      <span>Carregando armadilhas...</span>
    </div>
    }

    <mat-tab-group class="entities-tabs" (selectedIndexChange)="onTabChange($event)" [selectedIndex]="selectedTab()" preserveContent>
  
      <!-- ABA TABELA -->
      <mat-tab label="Tabela">
  
        <div class="tab-content">
  
          @if (pagedData().length === 0) {
          <div class="workspace-empty">
            Nenhuma armadilha encontrada.
          </div>
          }
          @else {
  
          <table mat-table [dataSource]="pagedData()" matSort (matSortChange)="onSort($event)">
            <ng-container matColumnDef="nome">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>
              <td mat-cell *matCellDef="let a">{{ a.nome }}</td>
            </ng-container>
  
            <ng-container matColumnDef="regiao">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Região</th>
              <td mat-cell *matCellDef="let a">{{ a.regiao }}</td>
            </ng-container>
  
            <ng-container matColumnDef="referencia">
              <th mat-header-cell *matHeaderCellDef>Referência</th>
              <td mat-cell *matCellDef="let a">{{ a.referencia }}</td>
            </ng-container>

                </button>
              </td>
            </ng-container> -->
  
            <tr mat-header-row *matHeaderRowDef="cols"></tr>
            <tr mat-row *matRowDef="let row; columns: cols" (click)="open(row)">
            </tr>
          </table>
  
          <mat-paginator [length]="filtered().length" [pageSize]="pageSize()" [pageIndex]="pageIndex()"
            [pageSizeOptions]="[10, 25, 50]" (page)="onPage($event)">
          </mat-paginator>
  
          }
  
        </div>
  
      </mat-tab>
  
      <!-- ABA MAPA -->
      <mat-tab label="Mapa">
  
        <div class="tab-content">
          <div class="map-container">
            <div #mapElement class="map"></div>
          </div>
        </div>
  
      </mat-tab>
  
    </mat-tab-group>

<div class="h-100">


    <div class="chart-layout h-100">

        <div class="d-flex">
            <app-period-control (periodoChange)="onPeriodoChange($event)"></app-period-control>

            <button class="chart-mode-btn ms-auto" (click)="toggleDoughnut()" [class.active]="showDoughnut">
                <span class="material-symbols-outlined">donut_small</span>
            </button>

        </div>
        <!-- <app-period-control (periodoChange)="onPeriodoChange($event)"></app-period-control> -->

        <div id="grafico-container-total-mes" class="p-2">
            <div class="title-container">
                <h5>
                    Total por Mês: {{titulo()}}
                </h5>

                <p>{{periodoLabel()}}</p>
            </div>

            <div class="charts">
                <div class="bar">

                    <canvas baseChart class="chart-md" [data]="chartData()" [options]="chartOptions" [type]="'bar'">
                    </canvas>

                </div>

                <div class="doughnut " [class.deactived]="!showDoughnut">

                    <canvas baseChart class="chart-md" [data]="doughnutData()" [options]="doughnutOptions"
                        [type]="'doughnut'"></canvas>

                </div>
            </div>
        </div>

    </div>



    <button class="chart-mode-btn" (click)="exportar()">
        <span class="material-symbols-outlined">download</span>
    </button>


</div>

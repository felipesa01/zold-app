<div class="page">

    <button mat-button class="back-btn" (click)="goBack()">
        <mat-icon>arrow_back</mat-icon>
        Workspace
    </button>

    <div class="page-header">
        <h1>Projetos</h1>

        <button mat-flat-button color="primary" (click)="create()">
            <mat-icon>add</mat-icon>
            Novo projeto
        </button>
    </div>

    <div class="search-box">
        <mat-icon>search</mat-icon>
        <input placeholder="Buscar projetos..." (input)="onSearch($event)" [value]="search()" />
    </div>

    <div class="filters-modern">
        <select class="filter-select" (change)="onStatus($event)">
            <option value="">Todos status</option>
            <option *ngFor="let s of statusOptions()" [value]="s">{{ s }}</option>
        </select>

        <select class="filter-select" (change)="onCidade($event)">
            <option value="">Todos as cidades</option>
            <option *ngFor="let s of cidadeOptions()" [value]="s">{{ s }}</option>
        </select>

        <button class="clear-btn" (click)="resetFilters()">Limpar</button>

        <button mat-stroked-button class="clear-btn ms-auto" (click)="reload()">
            <mat-icon>refresh</mat-icon>
            Atualizar
        </button>
    </div>

    @if (loading()) {
    <div class="workspace-loading">
        <mat-spinner diameter="40"></mat-spinner>
        <span>Carregando projetos...</span>
    </div>
    }
    @else {

    @if (pagedData().length === 0) {
    <div class="workspace-empty">Nenhum projeto encontrado.</div>
    }
    @else {

    <table mat-table [dataSource]="pagedData()" matSort (matSortChange)="onSort($event)">

        <ng-container matColumnDef="nome">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Projeto</th>
            <td mat-cell *matCellDef="let p">{{ p.nome }}</td>
        </ng-container>

        <ng-container matColumnDef="responsavel">
            <th mat-header-cell *matHeaderCellDef>Responsável</th>
            <td mat-cell *matCellDef="let p">{{ p.responsavel }}</td>
        </ng-container>

        <ng-container matColumnDef="cidade">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Cidade</th>
            <td mat-cell *matCellDef="let p">{{ p.cidade }}</td>
        </ng-container>

        <ng-container matColumnDef="uf">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>UF</th>
            <td mat-cell *matCellDef="let p">{{ p.uf }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let p">
                <mat-chip [color]="statusColor(p.status)" selected>
                    {{ p.status }}
                </mat-chip>
            </td>
        </ng-container>

        <ng-container matColumnDef="acoes">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let p">
                <button mat-icon-button (click)="open(p, $event)">
                    <mat-icon>open_in_new</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="cols"></tr>
        <tr mat-row *matRowDef="let row; columns: cols" (click)="open(row)"></tr>

    </table>

    <mat-paginator [length]="filtered().length" [pageSize]="pageSize()" [pageIndex]="pageIndex()"
        [pageSizeOptions]="[10,25,50]" (page)="onPage($event)">
    </mat-paginator>

    }
    }

</div>
